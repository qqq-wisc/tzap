[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tzap"
description = "A super fast, Rust-based optimizer for large Clifford+T circuits"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Aws Albarghouthi" }]
requires-python = ">=3.10"
dependencies = [
    "pennylane>=0.40",
    "qiskit>=1.0",
]
keywords = ["quantum", "circuit", "optimization", "qasm", "clifford"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
qcec = [
    "mqt.qcec>=3",
    "pytest>=7",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[project.scripts]
tzap = "tzap._cli:main"

[project.urls]
Repository = "https://github.com/qqq-wisc/tzap"
Homepage = "https://github.com/qqq-wisc/tzap"

[tool.maturin]
bindings = "pyo3"
features = ["python", "pyo3/extension-module"]
module-name = "tzap._native"
python-source = "python"
strip = true
# The sdist only has to build the extension module, so drop everything a
# source build never reads. benchmarks/ alone is 43 MB uncompressed — it was
# ~95% of the sdist. README.md points at GitHub for the assets/ figure, so
# excluding these leaves no broken references behind.
exclude = [
    ".github/**",
    "assets/**",
    "benchmarks/**",
    "experiments/**",
]

[tool.pytest.ini_options]
markers = [
    "qcec: randomized end-to-end equivalence checks using MQT QCEC",
]
