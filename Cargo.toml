[package]
# Published to crates.io as "tzap-opt" ("tzap" was already taken by an
# unrelated project) — the lib/bin names below keep everything else (the
# `tzap` binary, `use tzap::...` throughout this crate) unchanged.
name = "tzap-opt"
version = "0.6.1"
edition = "2024"
description = "A super fast, Rust-based optimizer for large Clifford+T circuits"
license = "Apache-2.0"
authors = ["Aws Albarghouthi"]
repository = "https://github.com/qqq-wisc/tzap"
homepage = "https://github.com/qqq-wisc/tzap"
keywords = ["quantum", "circuit", "optimization", "qasm", "clifford"]
categories = ["science", "command-line-utilities"]
readme = "README.md"

[lib]
name = "tzap"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tzap"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["abi3-py310"] }
rayon = "1"
rsgridsynth = "0.2.2"
rustc-hash = "2"
smallvec = "1"

[features]
python = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"
rand = "0.8"

# One codegen unit for our own crate only (dependencies keep the default, so
# clean-build times barely move — this costs ~3s on a crate rebuild). The hot
# SuperOpt scan is sensitive to how rustc partitions this crate: with the
# default 16 units, functionally irrelevant code motion — moving the
# optimization driver from the binary into the library, say — swings
# ols-ridge -O3 by ~3% in either direction. One unit both removes that noise
# and is faster outright.
[profile.release.package.tzap-opt]
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dist.package.tzap-opt]
codegen-units = 1
