name: CI

# Doc-only edits cannot break the build, so they skip the matrix. API.md is
# deliberately absent from these lists: src/lib.rs pulls it in with
# include_str!, so a bad doc link or doctest there does fail `cargo test`.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'formalization/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'formalization/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # uv runs tests/qcec_check.py (QCEC equivalence checking) from the
      # ignored test suite; caching keeps the mqt.qcec wheels warm.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cargo test
      # Extended PBC fuzzers default to hundreds of cases for manual runs.
      # Sample each width once in CI so the exact mid-circuit channel checks
      # fit the job limit; also bound the numerical stress fuzzer's case count.
      - name: Run release-only tests and fuzz samples
        env:
          PBC_FUZZ_CASES: "4"
          NUMERICAL_FUZZ_CASES: "128"
        run: cargo test --release -- --ignored

  # The release wheel matrix covers Windows and macOS, but nothing else in CI
  # compiles there — so a Windows-only build break would first show up at tag
  # time, after a release is already half-published. This is the cheap guard.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check python tests/python pyproject.toml
      - run: uv run ruff format --check python tests/python
      - run: uv run python -m mypy.stubtest tzap._native

  python-wheel-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the ABI3 wheel
        run: uvx --from "maturin>=1.7,<2.0" maturin build --release --out dist
      - name: Test the wheel on the minimum supported Python
        run: |
          uv venv --python 3.10 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python tests/python/wheel_smoke.py

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            qiskit: "qiskit==1.0.*"
            pennylane: "pennylane==0.40.*"
            autoray: "autoray<0.8"
          - python: "3.10"
            qiskit: "qiskit>=2"
            pennylane: "pennylane==0.42.*"
            autoray: "autoray<0.8"
          - python: "3.11"
            qiskit: "qiskit>=2"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
          - python: "3.12"
            qiskit: "qiskit>=2"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
          - python: "3.13"
            qiskit: "qiskit>=2"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
          - python: "3.14"
            qiskit: "qiskit>=2"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test Python integrations
        run: |
          uv venv --python "${{ matrix.python }}"
          uv pip install -e . "pytest>=7" \
            "${{ matrix.qiskit }}" "${{ matrix.pennylane }}" \
            "${{ matrix.autoray }}"
          uv run --no-sync pytest tests/python

  python-qcec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pennylane: "pennylane==0.42.*"
            autoray: "autoray<0.8"
          - python: "3.14"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prove Python adapter equivalence with MQT QCEC
        run: |
          uv venv --python "${{ matrix.python }}"
          uv pip install -e ".[qcec]" "qiskit>=2" \
            "${{ matrix.pennylane }}" "${{ matrix.autoray }}"
          uv run --no-sync pytest tests/python/test_qcec.py -m qcec -q
